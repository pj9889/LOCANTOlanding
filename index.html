<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Her Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background-color: #000;
        }

        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .bg-slide.active {
            opacity: 0.4; /* কন্ট্রাস্ট ভালো রাখার জন্য উজ্জ্বলতা কমিয়ে রাখা হয়েছে */
        }

        .wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
        }

        .top-logo-box {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-logo-box img {
            max-width: 100%;
            height: auto;
            max-height: 65px;
            object-fit: contain;
        }

        .card {
            background: rgba(15, 15, 25, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 35px 25px;
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }

        .text-title {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f1f5f9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .btn-shake-cta {
            background: linear-gradient(135deg, #00dbde, #fc00ff);
            color: white;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(0, 219, 222, 0.6);
            animation: lightShake 2s infinite, pulseGlow 1.5s infinite alternate;
            text-transform: uppercase;
        }

        @keyframes lightShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
            20%, 40%, 60%, 80% { transform: translateX(3px); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(0, 219, 222, 0.6); }
            100% { box-shadow: 0 0 30px rgba(252, 0, 255, 1); }
        }

        #bufferingScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #060713;
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        /* বাফারিং স্ক্রিনের লোগোর জন্য নতুন স্টাইল */
        .buffering-logo-box {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px; /* লোগোকে পেজের একটু ওপরে রাখার জন্য */
            margin-bottom: 30px;
        }

        .buffering-logo-box img {
            max-width: 100%;
            max-height: 60px; /* লোগোর সাইজ */
            object-fit: contain;
        }

        .radar-box {
            position: relative;
            width: 160px;
            height: 160px;
            border: 2px solid rgba(0, 219, 222, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            background: radial-gradient(circle, rgba(0,219,222,0.05) 0%, rgba(0,0,0,0) 70%);
        }

        .radar-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #00dbde;
            border-radius: 50%;
            opacity: 0;
            animation: pulseRadar 1.5s linear infinite;
        }

        @keyframes pulseRadar {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .live-photo-scan {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 3px solid #fc00ff;
            object-fit: cover;
            z-index: 25;
            box-shadow: 0 0 15px rgba(252, 0, 255, 0.6);
        }

        .scan-status {
            font-size: 18px;
            font-weight: bold;
            color: #23d160; /* সাকসেস কালার */
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-align: center;
            text-transform: uppercase;
        }

        .scan-details {
            font-size: 13px;
            color: #a1a1aa;
            text-align: center;
            font-family: monospace;
        }

    </style>
</head>
<body>

    <div class="bg-slider" id="mainSlider">
        <div class="bg-slide active" style="background-image: url('v1.webp');"></div>
        <div class="bg-slide" style="background-image: url('v2.webp');"></div>
        <div class="bg-slide" style="background-image: url('v3.webp');"></div>
        <div class="bg-slide" style="background-image: url('v4.webp');"></div>
        <div class="bg-slide" style="background-image: url('v5.webp');"></div>
    </div>

    <div class="wrapper" id="pageWrapper">
        <div class="top-logo-box">
            <img src="lgd1.png" alt="Locanto Logo">
        </div>

        <div class="card">
            <p class="text-title">
                Get connect you with single, married, unmarried, or divorced women near your location. Thousands of verified single women apply on this website for absolute sexual satisfaction.
            </p>
            <button class="btn-shake-cta" onclick="triggerBuffering()">GET LAID NOW</button>
        </div>
    </div>

    <div id="bufferingScreen">
        <div class="buffering-logo-box">
            <img src="sf1.png" alt="Secured Logo">
        </div>

        <div class="radar-box">
            <div class="radar-pulse"></div>
            <img src="q1.webp" id="liveScanPic" class="live-photo-scan" alt="Scanning">
        </div>
        <div class="scan-status">MATCH FOUND SUCCESSFULLY!</div>
        <div class="scan-details">Connecting secure profile terminal...</div>
    </div>

    <script>
        const slides = document.querySelectorAll('.bg-slide');
        let currentSlideIndex = 0;

        function changeBackground() {
            if(slides.length > 0) {
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                slides[currentSlideIndex].classList.add('active');
            }
        }
        setInterval(changeBackground, 1000); // ছবির স্লাইড চালু থাকবে

        function triggerBuffering() {
            // প্রথম পেজ হাইড করবে
            document.getElementById('pageWrapper').style.display = 'none';
            // বাফারিং স্ক্রিন ডিসপ্লে করবে
            document.getElementById('bufferingScreen').style.display = 'flex';

            const scanPic = document.getElementById('liveScanPic');

            // স্ক্যানিং এনিমেশন
            let picNumber = 1;
            const picInterval = setInterval(() => {
                scanPic.src = 'q' + picNumber + '.webp';
                picNumber = (picNumber % 10) + 1;
            }, 100);

            // ৩ সেকেন্ডের টাইমার - বাফারিং এর পর এফিলিট লিংক ওপেন করবে
            setTimeout(() => {
                clearInterval(picInterval);
                // বাফারিং শেষ হলে যে ছবি থাকবে
                scanPic.src = 'fgk.webp'; 
                
                // বাফারিং স্ক্রিন হাইড করবে
                document.getElementById('bufferingScreen').style.display = 'none';
                
                // অটোমেটিকভাবে এফিলিট লিংক ওপেন করবে
                window.open("https://paysale.g2afse.com/click?pid=125904&offer_id=10417&sub1=Locantox1", "_self");
                
            }, 3000); // ঠিক ৩ সেকেন্ড পর্যন্ত বাফারিং করবে
        }
    </script>
</body>
</html>
